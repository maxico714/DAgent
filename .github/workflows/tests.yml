name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the offline suite
        run: pytest tests -q

      - name: Check every notebook code cell parses
        run: |
          python - <<'PY'
          import ast, json, pathlib, sys
          nb = json.loads(pathlib.Path("DAgent.ipynb").read_text(encoding="utf-8"))
          bad = []
          for i, cell in enumerate(nb["cells"]):
              if cell["cell_type"] != "code":
                  continue
              src = "".join(cell["source"])
              if not src.strip():
                  continue
              try:
                  ast.parse(src)
              except SyntaxError as exc:
                  bad.append((i, exc))
          print("code cells checked:", sum(1 for c in nb["cells"] if c["cell_type"] == "code"))
          for i, exc in bad:
              print("SYNTAX ERROR in cell", i, "::", exc)
          sys.exit(1 if bad else 0)
          PY
